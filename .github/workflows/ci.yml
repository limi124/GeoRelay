name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:disaster
      - run: npm run model:verify
      - run: npm run check:secrets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.65.2
      - run: python -m playwright install --with-deps --no-shell chromium
      - name: Desktop editor and preset flow
        run: |
          node server/api.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8791/ >/dev/null
          python scripts/e2e_preset.py
