# GeoRelay - fixed OpenQuake Scenario Damage case (quake_scenario_damage_v1)
#
# Single deterministic scenario: one rupture, one GMPE, one set of 10 ground
# motion fields. Sections/parameters follow the layout used by the OpenQuake
# Engine 3.26.2 shipped QA data (scenario_damage/case_1c, case_13).
#
# No uncertainty / no logic tree / no event set: this is a demonstration case,
# NOT a real community safety assessment. See README.md.
#
# The exposure is a CSV asset table (exposure.csv) referenced by the NRML
# wrapper exposure_model.xml, which is how OpenQuake reads CSV exposures: the
# XML declares the cost types and the <assets> filename.

[general]
description = GeoRelay demo community - fixed scenario damage (quake_scenario_damage_v1)
calculation_mode = scenario_damage
random_seed = 42

[exposure]
exposure_file = exposure_model.xml

[rupture]
rupture_model_file = rupture_model.xml
rupture_mesh_spacing = 2.0

[site_params]
site_model_file = site_model.csv

[fragility]
structural_fragility_file = fragility.xml

[hazard]
asset_hazard_distance = 5.0

[calculation]
gsim = BooreAtkinson2008
truncation_level = 3.0
maximum_distance = 200.0
number_of_ground_motion_fields = 10
intensity_measure_types = PGA
